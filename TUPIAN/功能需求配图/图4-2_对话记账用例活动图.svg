<polygon points="900,1020 1110,1095 900,1170 690,1095" fill="#ffffff" stroke="#d9e4de" stroke-width="2"/>
<text x="812" y="1091" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="22" font-weight="700" fill="#f3a33a">是否解析出账单？</text>
<text x="808" y="1121" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="18" font-weight="400" fill="#6b7d73">intent=bill 且 bills 非空</text>
<line x1="900" y1="965" x2="900" y2="1010" stroke="#6b7d73" stroke-width="3" stroke-linecap="round"/>
<polygon points="900,1010 890,994 909,994" fill="#6b7d73"/>
<rect x="270" y="1230" width="440" height="135" rx="24" fill="#ffffff" stroke="#d9e4de" stroke-width="2" filter="url(#shadow)"/>
<rect x="270" y="1230" width="10" height="135" fill="#27c07d" stroke="#27c07d" stroke-width="1"/>
<text x="298" y="1276" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="24" font-weight="700" fill="#17231d">展示待确认账单卡</text>
<text x="298" y="1315" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="19" font-weight="400" fill="#6b7d73">用户可编辑金额/备注、删除行、勾选新分类</text>
<rect x="1090" y="1230" width="440" height="135" rx="24" fill="#ffffff" stroke="#d9e4de" stroke-width="2" filter="url(#shadow)"/>
<rect x="1090" y="1230" width="10" height="135" fill="#5ba4cb" stroke="#5ba4cb" stroke-width="1"/>
<text x="1118" y="1276" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="24" font-weight="700" fill="#17231d">展示普通回复</text>
<text x="1118" y="1315" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="19" font-weight="400" fill="#6b7d73">闲聊 / 查账回复 / 失败兜底提示</text>
<line x1="682" y1="1095" x2="490" y2="1222" stroke="#27c07d" stroke-width="3" stroke-linecap="round"/>
<polygon points="490,1222 497,1205 507,1221" fill="#27c07d"/>
<line x1="1118" y1="1095" x2="1310" y2="1222" stroke="#5ba4cb" stroke-width="3" stroke-linecap="round"/>
<polygon points="1310,1222 1292,1221 1302,1205" fill="#5ba4cb"/>
<text x="575" y="1152" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="700" fill="#157a51">是</text>
<text x="1180" y="1152" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="700" fill="#5ba4cb">否</text>
<rect x="270" y="1410" width="440" height="130" rx="24" fill="#e8f5ee" stroke="#d9e4de" stroke-width="2" filter="url(#shadow)"/>
<rect x="270" y="1410" width="10" height="130" fill="#27c07d" stroke="#27c07d" stroke-width="1"/>
<text x="298" y="1456" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="24" font-weight="700" fill="#17231d">确认记账</text>
<text x="298" y="1496" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">调用 bills.batchCreate，最多 10 笔</text>
<rect x="810" y="1410" width="440" height="130" rx="24" fill="#fff7eb" stroke="#d9e4de" stroke-width="2" filter="url(#shadow)"/>
<rect x="810" y="1410" width="10" height="130" fill="#f3a33a" stroke="#f3a33a" stroke-width="1"/>
<text x="838" y="1456" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="24" font-weight="700" fill="#17231d">取消 / 删除行</text>
<text x="838" y="1496" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">清空确认卡或保留对话上下文</text>
<line x1="490" y1="1375" x2="490" y2="1400" stroke="#27c07d" stroke-width="3" stroke-linecap="round"/>
<polygon points="490,1400 480,1384 499,1384" fill="#27c07d"/>
