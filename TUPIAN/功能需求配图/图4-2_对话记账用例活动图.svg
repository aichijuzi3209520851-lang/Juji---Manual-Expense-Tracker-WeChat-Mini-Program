<text x="638" y="378" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="26" font-weight="700" fill="#17231d">输入口语消费</text>
<text x="638" y="418" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">如：中午吃饭18、冰红茶4、电费40</text>
<rect x="610" y="500" width="580" height="115" rx="24" fill="#ffffff" stroke="#d9e4de" stroke-width="2" filter="url(#shadow)"/>
<rect x="610" y="500" width="10" height="115" fill="#f3a33a" stroke="#f3a33a" stroke-width="1"/>
<text x="638" y="548" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="26" font-weight="700" fill="#17231d">内容安全检查</text>
<text x="638" y="588" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">本地正则 + msgSecCheck</text>
<rect x="610" y="670" width="580" height="115" rx="24" fill="#ffffff" stroke="#d9e4de" stroke-width="2" filter="url(#shadow)"/>
<rect x="610" y="670" width="10" height="115" fill="#5ba4cb" stroke="#5ba4cb" stroke-width="1"/>
<text x="638" y="718" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="26" font-weight="700" fill="#17231d">调用 aiChat</text>
<text x="638" y="758" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">携带消息、分类列表、今日日期</text>
<rect x="610" y="840" width="580" height="115" rx="24" fill="#ffffff" stroke="#d9e4de" stroke-width="2" filter="url(#shadow)"/>
