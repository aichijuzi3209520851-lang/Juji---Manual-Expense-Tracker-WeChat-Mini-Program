<rect x="615" y="1045" width="700" height="42" rx="21" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
<text x="632" y="1073" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="700" fill="#157a51">设计目的：快速拦截明显违规内容，同时用微信语义审核补足隐晦风险</text>
