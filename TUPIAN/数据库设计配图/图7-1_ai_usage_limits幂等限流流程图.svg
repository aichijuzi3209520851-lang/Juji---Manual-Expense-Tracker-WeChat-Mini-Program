<rect x="120" y="245" width="10" height="170" fill="#27c07d" stroke="#27c07d" stroke-width="1"/>
<text x="148" y="291" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="24" font-weight="700" fill="#17231d">功能限额</text>
<text x="148" y="331" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">profileLetter：30 次/日</text>
<text x="148" y="361" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">profileTitle：8 次/日</text>
