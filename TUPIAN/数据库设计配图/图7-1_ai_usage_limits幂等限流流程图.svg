<text x="498" y="397" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="25" font-weight="700" fill="#17231d">2. 生成日期键</text>
<text x="498" y="437" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">北京时间 YYYY-MM-DD</text>
<text x="498" y="467" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">避免跨时区计数偏差</text>
<rect x="470" y="515" width="860" height="125" rx="24" fill="#ffffff" stroke="#d9e4de" stroke-width="2" filter="url(#shadow)"/>
<rect x="470" y="515" width="10" height="125" fill="#8c7bd9" stroke="#8c7bd9" stroke-width="1"/>
<text x="498" y="562" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="25" font-weight="700" fill="#17231d">3. 构造 docId</text>
<text x="498" y="602" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">openid_date_feature</text>
<text x="498" y="632" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">replace 非法字符为 _</text>
<rect x="470" y="680" width="860" height="125" rx="24" fill="#ffffff" stroke="#d9e4de" stroke-width="2" filter="url(#shadow)"/>
