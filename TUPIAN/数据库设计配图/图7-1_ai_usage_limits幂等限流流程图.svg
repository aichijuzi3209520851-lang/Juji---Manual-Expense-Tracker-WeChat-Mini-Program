<text x="1408" y="331" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">超过 limit：</text>
<text x="1408" y="361" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">返回 remaining=0</text>
<text x="1408" y="391" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">不调用 AI 模型</text>
<line x1="1300" y1="910" x2="1380" y2="330" stroke="#ba1a1a" stroke-width="3" stroke-linecap="round"/>
<polygon points="1380,330 1387,346 1368,343" fill="#ba1a1a"/>
<rect x="555" y="1285" width="760" height="42" rx="21" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
<text x="572" y="1313" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="700" fill="#157a51">幂等核心：同一用户、同一日期、同一功能只命中同一个计数文档</text>
