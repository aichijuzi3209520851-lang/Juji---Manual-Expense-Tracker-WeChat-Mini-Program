<text x="498" y="727" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="25" font-weight="700" fill="#17231d">4. 查询计数文档</text>
<text x="498" y="767" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">db.collection('ai_usage_limits').doc(docId).get()</text>
<rect x="260" y="835" width="480" height="150" rx="24" fill="#ffffff" stroke="#d9e4de" stroke-width="2" filter="url(#shadow)"/>
<rect x="260" y="835" width="10" height="150" fill="#27c07d" stroke="#27c07d" stroke-width="1"/>
<text x="288" y="882" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="25" font-weight="700" fill="#17231d">5A. 不存在：初始化</text>
<text x="288" y="922" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">count = 1</text>
<text x="288" y="952" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">limit = 30 或 8</text>
<text x="288" y="982" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">createdAt / updatedAt</text>
<rect x="820" y="835" width="480" height="150" rx="24" fill="#ffffff" stroke="#d9e4de" stroke-width="2" filter="url(#shadow)"/>
<rect x="820" y="835" width="10" height="150" fill="#f3a33a" stroke="#f3a33a" stroke-width="1"/>
<text x="848" y="882" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="25" font-weight="700" fill="#17231d">5B. 已存在：检查限额</text>
<text x="848" y="922" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">count &gt;= limit 则拒绝</text>
<text x="848" y="952" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">否则 count + 1</text>
<rect x="470" y="1090" width="860" height="125" rx="24" fill="#ffffff" stroke="#d9e4de" stroke-width="2" filter="url(#shadow)"/>
<rect x="470" y="1090" width="10" height="125" fill="#27c07d" stroke="#27c07d" stroke-width="1"/>
<text x="498" y="1137" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="25" font-weight="700" fill="#17231d">6. 允许调用 AI</text>
<text x="498" y="1177" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">混元 generateText</text>
<text x="498" y="1207" font-family="Microsoft YaHei,Noto Sans SC,SimHei,sans-serif" font-size="20" font-weight="400" fill="#6b7d73">返回 remaining</text>
